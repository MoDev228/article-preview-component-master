<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- displays site properly based on user's device -->

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./images/favicon-32x32.png"
    />

    <title>Frontend Mentor | Article preview component</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <main class="container">
      <section class="content">
        <article class="card">
          <aside class="card__profil">
            <picture>
              <img src="./public/images/drawers.jpg" alt="Drawers" />
            </picture>
          </aside>
          <aside class="card__infos">
            <h3 class="infos-title">
              Shift the overall look and feel by adding these wonderful touches
              to furniture in your home
            </h3>
            <p class="infos-description">
              Ever been in a room and felt like something was missing? Perhaps
              it felt slightly bare and uninviting. I’ve got some simple tips to
              help you make any room feel complete.
            </p>
            <div class="infos-profil">
              <figure>
                <img src="./public/images/avatar-michelle.jpg" alt="Michelle" />
                <div class="">
                  <p>Michelle Appleton</p>
                  <span>28 Jun 2020</span>
                </div>
              </figure>
              <a href="#" class="share-btn"
                ><img src="./public/images/icon-share.svg" alt="Share"
              /></a>

              <div class="share-bubble" id="share-bubble">
                <span>Share</span>
                <img
                  src="./public/images/icon-facebook.svg"
                  alt="icon-facebook"
                />
                <img
                  src="./public/images/icon-pinterest.svg"
                  alt="icon-pinterest"
                />
                <img
                  src="./public/images/icon-twitter.svg"
                  alt="icon-twitter"
                />
              </div>
            </div>
          </aside>
        </article>
      </section>
    </main>

    <script type="module" src="./src/main.js"></script>
  </body>
</html>
